<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV PARAMBOS RAYA - Tracking Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f2937">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    </script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="https://i.imgur.com/g11G1zf.png" alt="CV PARAMBOS RAYA Logo" class="h-10 w-auto object-contain">
                <div>
                    <h1 class="font-bold text-lg leading-none">CV PARAMBOS RAYA</h1>
                    <p class="text-xs text-gray-400">LOGISTICS & TRANSPORTATION</p>
                </div>
            </div>
            <a href="admin.html" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded-lg transition">Panel Admin</a>
        </div>
    </header>

    <!-- Main Content Tracking -->
    <main class="container mx-auto p-4 max-w-lg my-auto">
        <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl shadow-xl">
            <h2 class="text-xl font-bold text-center mb-2">Solusi Logistik Terintegrasi & Real-Time Tracking</h2>
            <p class="text-xs text-gray-400 text-center mb-6">Lacak pengiriman barang (Shipment) & Delivery Order (DO) armada CV PARAMBOS RAYA dengan akurat.</p>
            
            <div class="space-y-4">
                <input type="text" id="trackingInput" placeholder="Masukkan Nomor Shipment / Resi" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white focus:outline-none focus:border-blue-500">
                <button onclick="trackShipment()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition">Lacak Sekarang →</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-4 text-center text-xs text-gray-500">
        &copy; CV PARAMBOS RAYA Logistics. All Rights Reserved.
    </footer>

    <script>
        function trackShipment() {
            const input = document.getElementById('trackingInput').value;
            if(!input) {
                alert('Silakan masukkan nomor resi / DO!');
                return;
            }
            alert('Mencari nomor resi: ' + input);
        }
    </script>
</body>
</html>
