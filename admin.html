<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - PARAMBOS LOGISTICS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f2937">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    </script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- Modal Password Protection Admin -->
    <div id="loginModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl w-full max-w-sm text-center shadow-2xl">
            <!-- LOGO IMGUR -->
            <img src="https://i.imgur.com/g11G1zf.png" alt="CV PARAMBOS RAYA" class="h-16 w-auto mx-auto mb-3 object-contain">
            <h2 class="text-xl font-bold text-white mb-1">Akses Panel Admin</h2>
            <p class="text-xs text-gray-400 mb-5">CV PARAMBOS RAYA Logistics</p>

            <input type="password" id="adminPassInput" placeholder="Masukkan Kata Sandi" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white mb-3 text-center focus:outline-none focus:border-blue-500">
            <button onclick="checkAdminPassword()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition">Masuk Panel</button>
            <p id="errorMsg" class="text-red-400 text-xs mt-3 hidden">⚠️ Kata sandi salah, coba lagi!</p>
        </div>
    </div>

    <!-- Main Content Panel (Hidden sebelum login) -->
    <div id="adminContent" class="hidden p-4 max-w-4xl mx-auto space-y-6">
        <!-- Header Panel Admin -->
        <div class="flex justify-between items-center pb-4 border-b border-gray-800">
            <div class="flex items-center space-x-3">
                <img src="https://i.imgur.com/g11G1zf.png" alt="Logo" class="h-10 w-auto object-contain">
                <div>
                    <h1 class="font-bold text-xl text-blue-400">PANEL OPERASIONAL & KIRIM WA</h1>
                    <p class="text-xs text-gray-400">CV PARAMBOS RAYA - Master Admin</p>
                </div>
            </div>
            <a href="index.html" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded-lg transition">🌐 Web Utama</a>
        </div>

        <!-- Form Input Status Pengiriman -->
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg space-y-4">
            <h2 class="text-lg font-bold text-blue-400 flex items-center space-x-2">
                <span>📌 Input Status Pengiriman</span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nomor Resi / DO</label>
                    <input type="text" id="doNumber" placeholder="Contoh: PBR-8821" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">No. WA Pelanggan (628...)</label>
                    <input type="text" id="waNumber" placeholder="Contoh: 628123456789" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nama Pengirim / Penerima</label>
                    <input type="text" id="customerName" placeholder="Contoh: Pak Budi / PT Maju" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Kota / Alamat Tujuan</label>
                    <input type="text" id="destination" placeholder="Contoh: Surabaya" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Status Pengiriman</label>
                    <select id="statusSelect" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white">
                        <option value="PROSES MUAT">PROSES MUAT (Gudang Utama)</option>
                        <option value="DALAM PERJALANAN">DALAM PERJALANAN (Transit)</option>
                        <option value="SELESAI">SELESAI (Tiba di Tujuan)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Catatan Posisi Terbaru</label>
                    <input type="text" id="latestLog" placeholder="Contoh: Rest Area KM 102" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white">
                </div>
            </div>

            <!-- Tombol WA Admin Operasional -->
            <div class="pt-2 border-t border-gray-700/50">
                <label class="block text-xs text-blue-400 mb-1">Nomor WA Operasional Admin (Untuk Salinan Arsip BCC)</label>
                <input type="text" id="adminWaNumber" placeholder="Contoh: 628123456789" value="628123456789" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white text-xs">
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <button onclick="saveDO()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition">💾 Simpan & Buat Label</button>
                <button onclick="sendWA('customer')" class="bg-green-600 hover:bg-green-500 text-white font-semibold px-5 py-3 rounded-xl flex items-center justify-center gap-2 transition">📲 WA Pelanggan</button>
                <button onclick="sendWA('admin')" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold px-5 py-3 rounded-xl transition">📩 Kirim Arsip Admin</button>
            </div>
        </div>

        <!-- Area Cetak Resi / Label -->
        <div id="printArea" class="hidden bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl space-y-4">
            <h3 class="text-md font-bold text-gray-300">📄 Label Resi Siap Cetak</h3>
            <div id="resiBox" class="bg-white text-black p-6 rounded-xl border border-gray-300 space-y-3 max-w-md mx-auto font-sans">
                <div class="flex justify-between items-center border-b pb-3">
                    <div>
                        <h2 class="font-black text-xl text-blue-900">PARAMBOS LOGISTICS</h2>
                        <p class="text-[10px] text-gray-500">Ekspedisi & Logistik Terpercaya</p>
                    </div>
                    <img src="https://i.imgur.com/g11G1zf.png" class="h-10 w-auto object-contain">
                </div>
                <div class="text-center py-2 border-b border-gray-200">
                    <svg id="barcode" class="mx-auto"></svg>
                    <p class="text-xs font-mono font-bold mt-1" id="lblNumber">-</p>
                </div>
                <div class="text-xs space-y-1">
                    <p><strong>Pelanggan:</strong> <span id="lblCustomer">-</span></p>
                    <p><strong>Tujuan:</strong> <span id="lblDestination">-</span></p>
                    <p><strong>Status:</strong> <span id="lblStatus">-</span></p>
                </div>
            </div>
            <div class="text-center pt-2">
                <button onclick="window.print()" class="bg-green-600 hover:bg-green-500 text-white font-bold px-6 py-2 rounded-xl transition">🖨️ Cetak Resi / PDF</button>
            </div>
        </div>
    </div>

    <!-- Script Logika Admin -->
    <script>
        const PASS_ADMIN = "admin123"; // Kata sandi masuk panel admin

        function checkAdminPassword() {
            const inputPass = document.getElementById('adminPassInput').value;
            if (inputPass === PASS_ADMIN) {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        function saveDO() {
            const doNum = document.getElementById('doNumber').value;
            const customer = document.getElementById('customerName').value;
            const dest = document.getElementById('destination').value;
            const status = document.getElementById('statusSelect').value;

            if (!doNum || !customer || !dest) {
                alert('Silakan isi No. Resi, Nama Pelanggan, dan Tujuan!');
                return;
            }

            document.getElementById('lblNumber').innerText = doNum;
            document.getElementById('lblCustomer').innerText = customer;
            document.getElementById('lblDestination').innerText = dest;
            document.getElementById('lblStatus').innerText = status;

            JsBarcode("#barcode", doNum, {
                format: "CODE128",
                lineColor: "#000",
                width: 2,
                height: 50,
                displayValue: false
            });

            document.getElementById('printArea').classList.remove('hidden');
        }

        function sendWA(target) {
            const doNum = document.getElementById('doNumber').value;
            const customer = document.getElementById('customerName').value;
            const dest = document.getElementById('destination').value;
            const status = document.getElementById('statusSelect').value;
            const log = document.getElementById('latestLog').value;

            let targetNum = "";
            if (target === "customer") {
                targetNum = document.getElementById('waNumber').value;
                if (!targetNum) { alert("Masukkan No. WA Pelanggan!"); return; }
            } else {
                targetNum = document.getElementById('adminWaNumber').value;
                if (!targetNum) { alert("Masukkan No. WA Admin!"); return; }
            }

            const message = `Halo Kak ${customer}, berikut update pengiriman barang untuk Nomor DO: *${doNum}*\n\n📍 *Tujuan:* ${dest}\n📦 *Status:* ${status}\n🚚 *Posisi Terkini:* ${log || '-'}\n\nTerima kasih telah menggunakan jasa *CV PARAMBOS RAYA*.`;
            window.open(`https://wa.me/${targetNum}?text=${encodeURIComponent(message)}`, '_blank');
        }
    </script>
</body>
</html>
