<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - CV PARAMBOS RAYA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- Modal Login Kata Sandi Admin -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 p-6 rounded-xl shadow-2xl w-full max-w-md text-center border border-gray-700">
            <h2 class="text-2xl font-bold mb-2 text-blue-400">Panel Admin Logistik</h2>
            <p class="text-gray-400 text-sm mb-6">CV PARAMBOS RAYA</p>
            <input type="password" id="adminPassword" placeholder="Masukkan Kata Sandi Admin" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-lg mb-4 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="checkPassword()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">Masuk Panel</button>
            <p id="errorMsg" class="text-red-400 text-xs mt-3 hidden">Kata sandi salah! Silakan coba lagi.</p>
        </div>
    </div>

    <!-- Konten Main Admin -->
    <div id="adminContent" class="hidden container mx-auto p-4 md:p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-blue-400">Panel Input Operasional</h1>
            <a href="index.html" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-2 rounded">Lihat Web Utama</a>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl shadow border border-gray-700 mb-8">
            <h2 class="text-lg font-semibold mb-4 text-gray-200">Input Data Resi / DO Baru</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="doNumber" placeholder="Nomor Resi / DO (Contoh: PRB-8821)" class="bg-gray-700 border border-gray-600 p-2.5 rounded text-white placeholder-gray-400">
                <input type="text" id="customerName" placeholder="Nama Pengirim / Penerima" class="bg-gray-700 border border-gray-600 p-2.5 rounded text-white placeholder-gray-400">
                <input type="text" id="destination" placeholder="Kota / Alamat Tujuan" class="bg-gray-700 border border-gray-600 p-2.5 rounded text-white placeholder-gray-400">
                <select id="statusSelect" class="bg-gray-700 border border-gray-600 p-2.5 rounded text-white">
                    <option value="PROSES MUAT">PROSES MUAT</option>
                    <option value="DALAM PERJALANAN">DALAM PERJALANAN</option>
                    <option value="TERKIRIM">TERKIRIM</option>
                </select>
            </div>
            <button onclick="saveDO()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg mt-4 transition">Simpan & Buat Label Barcode</button>
        </div>

        <div id="printArea" class="bg-gray-800 p-6 rounded-xl shadow border border-gray-700 hidden text-black">
            <h2 class="text-lg font-semibold mb-4 text-white">Label Resi Pengiriman</h2>
            <div class="bg-white p-6 rounded-lg max-w-md mx-auto text-center">
                <h3 class="font-bold text-xl text-blue-900">CV PARAMBOS RAYA</h3>
                <p class="text-xs text-gray-600 mb-2">Surat Jalan & Bukti Pengiriman</p>
                <hr class="my-2">
                <svg id="barcode" class="mx-auto"></svg>
                <p class="text-xs font-mono font-bold mt-1" id="lblDoNumber"></p>
                <div class="text-left text-sm mt-4 space-y-1">
                    <p><strong>Pengirim/Penerima:</strong> <span id="lblCustomer"></span></p>
                    <p><strong>Tujuan:</strong> <span id="lblDestination"></span></p>
                    <p><strong>Status:</strong> <span id="lblStatus"></span></p>
                </div>
            </div>
            <div class="text-center mt-4">
                <button onclick="window.print()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-semibold">🖨️ Cetak / Save PDF</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASS = "parambos123";

        function checkPassword() {
            const input = document.getElementById('adminPassword').value;
            if(input === ADMIN_PASS) {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        function saveDO() {
            const doNum = document.getElementById('doNumber').value;
            const customer = document.getElementById('customerName').value;
            const dest = document.getElementById('destination').value;
            const status = document.getElementById('statusSelect').value;

            if(!doNum || !customer || !dest) {
                alert('Silakan isi seluruh kolom data pengiriman!');
                return;
            }

            document.getElementById('lblDoNumber').innerText = doNum;
            document.getElementById('lblCustomer').innerText = customer;
            document.getElementById('lblDestination').innerText = dest;
            document.getElementById('lblStatus').innerText = status;

            JsBarcode("#barcode", doNum, {
                format: "CODE128",
                lineColor: "#000",
                width: 2,
                height: 50,
                displayValue: false
            });

            document.getElementById('printArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
