<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - PARAMBOS LOGISTICS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-blue-400">Panel Operasional & Kirim WA</h1>
            <a href="index.html" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-2 rounded-lg">Web Utama</a>
        </div>

        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl mb-8 space-y-4">
            <h2 class="text-lg font-semibold text-gray-200 border-b border-gray-700 pb-2">Input Status Pengiriman</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nomor Resi / DO *</label>
                    <input type="text" id="doNumber" placeholder="Contoh: PRB-8821" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">No. WhatsApp Pelanggan (628...)</label>
                    <input type="text" id="waNumber" placeholder="Contoh: 6281234567890" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nama Pengirim / Penerima</label>
                    <input type="text" id="customerName" placeholder="Contoh: PT Sukses Mandiri" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Kota / Alamat Tujuan</label>
                    <input type="text" id="destination" placeholder="Contoh: Surabaya" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Status Pengiriman</label>
                    <select id="statusSelect" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-xl text-white">
                        <option value="PROSES MUAT">PROSES MUAT (Gudang Jakarta)</option>
                        <option value="DALAM PERJALANAN">DALAM PERJALANAN (Transit Tol Cikampek)</option>
                        <option value="TERKIRIM">TERKIRIM (Tiba di Lokasi Tujuan)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Catatan Posisi Terbaru</label>
                    <input type="text" id="latestLog" placeholder="Contoh: Rest Area KM 102" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-xl text-white">
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <button onclick="saveDO()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">Simpan & Buat Label</button>
                <button onclick="sendWA()" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-3 rounded-xl transition flex items-center justify-center gap-2">📱 Kirim WA Pelanggan</button>
            </div>
        </div>

        <div id="printArea" class="bg-gray-800 p-6 rounded-2xl border border-gray-700 hidden text-black">
            <h2 class="text-lg font-semibold mb-4 text-white">Label Resi Siap Cetak</h2>
            <div class="bg-white p-6 rounded-xl max-w-md mx-auto text-center shadow-lg">
                <h3 class="font-bold text-xl text-blue-900">PARAMBOS LOGISTICS</h3>
                <p class="text-xs text-gray-500 mb-2">Ekspedisi & Logistik Terpercaya</p>
                <hr class="my-2 border-gray-300">
                <svg id="barcode" class="mx-auto"></svg>
                <p class="text-xs font-mono font-bold mt-1" id="lblDoNumber"></p>
                <div class="text-left text-sm mt-4 space-y-1">
                    <p><strong>Pelanggan:</strong> <span id="lblCustomer"></span></p>
                    <p><strong>Tujuan:</strong> <span id="lblDestination"></span></p>
                    <p><strong>Status:</strong> <span id="lblStatus"></span></p>
                </div>
            </div>
            <div class="text-center mt-4">
                <button onclick="window.print()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-xl font-semibold">🖨️ Cetak Resi / PDF</button>
            </div>
        </div>
    </div>

    <script>
        function saveDO() {
            const doNum = document.getElementById('doNumber').value;
            const customer = document.getElementById('customerName').value;
            const dest = document.getElementById('destination').value;
            const status = document.getElementById('statusSelect').value;

            if(!doNum || !customer || !dest) {
                alert('Silakan isi Nomor DO, Nama Pelanggan, dan Tujuan!');
                return;
            }

            document.getElementById('lblDoNumber').innerText = doNum;
            document.getElementById('lblCustomer').innerText = customer;
            document.getElementById('lblDestination').innerText = dest;
            document.getElementById('lblStatus').innerText = status;

            JsBarcode("#barcode", doNum, {
                format: "CODE128",
                lineColor: "#000",
                width: 2,
                height: 50,
                displayValue: false
            });

            document.getElementById('printArea').classList.remove('hidden');
        }

        function sendWA() {
            const doNum = document.getElementById('doNumber').value;
            const waNum = document.getElementById('waNumber').value;
            const customer = document.getElementById('customerName').value;
            const dest = document.getElementById('destination').value;
            const status = document.getElementById('statusSelect').value;
            const log = document.getElementById('latestLog').value;

            if(!doNum || !waNum) {
                alert('Masukkan Nomor DO dan No. WA Pelanggan!');
                return;
            }

            const message = `Halo Kak *${customer}*,\n\nBerikut update pengiriman barang untuk Nomor DO: *${doNum}*\n📍 *Tujuan:* ${dest}\n📦 *Status:* ${status}\n📝 *Posisi Terkini:* ${log}\n\nLacak status pengiriman Anda kapan saja di website kami.\n\nTerima kasih,\n*PARAMBOS LOGISTICS*`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${waNum}?text=${encodedMessage}`, '_blank');
        }
    </script>
</body>
</html>
