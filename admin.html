<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - PARAMBOS LOGISTICS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- Modal Password Protection Admin -->
    <div id="loginModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl w-full max-w-sm text-center shadow-2xl">
            <div class="bg-blue-600/20 text-blue-400 p-3 rounded-full w-14 h-14 mx-auto mb-3 flex items-center justify-center text-2xl font-bold">
                🔒
            </div>
            <h2 class="text-xl font-bold text-white mb-1">Akses Panel Admin</h2>
            <p class="text-xs text-gray-400 mb-5">CV PARAMBOS RAYA Logistics</p>
            
            <input type="password" id="adminPassInput" placeholder="Masukkan Kata Sandi" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-xl text-white text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3">
            
            <button onclick="checkAdminPassword()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">Masuk Panel</button>
            <p id="errorMsg" class="text-red-400 text-xs mt-3 hidden">⚠️ Kata sandi salah, coba lagi!</p>
        </div>
    </div>

    <!-- Main Content Panel (Hidden sebelum login) -->
    <div id="adminContent" class="hidden container mx-auto p-4 md:p-8 max-w-4xl">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-blue-400">Panel Operasional & Kirim WA</h1>
                <p class="text-xs text-gray-400">CV PARAMBOS RAYA - Master Admin</p>
            </div>
            <a href="index.html" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-2 rounded-lg">Web Utama</a>
        </div>

        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl mb-8 space-y-4">
            <h2 class="text-lg font-semibold text-gray-200 border-b border-gray-700 pb-2">Input Status Pengiriman</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nomor Resi / DO *</label>
                    <input type="text" id="doNumber" placeholder="Contoh: PRB-8821" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">No. WA Pelanggan (628...)</label>
                    <input type="text" id="waNumber" placeholder="Contoh: 6281234567890" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nama Pengirim / Penerima</label>
                    <input type="text" id="customerName" placeholder="Contoh: PT Sukses Mandiri" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Kota / Alamat Tujuan</label>
                    <input type="text" id="destination" placeholder="Contoh: Surabaya" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Status Pengiriman</label>
                    <select id="statusSelect" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-xl text-white">
                        <option value="PROSES MUAT">PROSES MUAT (Gudang Utama)</option>
                        <option value="DALAM PERJALANAN">DALAM PERJALANAN (Transit)</option>
                        <option value="TERKIRIM">TERKIRIM (Tiba di Tujuan)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Catatan Posisi Terbaru</label>
                    <input type="text" id="latestLog" placeholder="Contoh: Rest Area KM 102" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-xl text-white">
                </div>
            </div>

            <!-- Set Nomor WA Admin Operasional -->
            <div class="bg-gray-900/60 p-3 rounded-xl border border-gray-700/80">
                <label class="block text-xs text-blue-400 mb-1 font-semibold">📌 Nomor WA Operasional Admin (Untuk Salinan Arsip BCC)</label>
                <input type="text" id="adminWaNumber" value="6281234567890" placeholder="Masukkan Nomor WA Admin Operasional" class="w-full bg-gray-800 border border-gray-700 p-2 rounded-lg text-white text-xs">
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <button onclick="saveDO()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">Simpan & Buat Label</button>
                <button onclick="sendWA('customer')" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-5 py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm">📱 Kirim WA Pelanggan</button>
                <button onclick="sendWA('admin')" class="bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold px-4 py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm">📋 Salinan ke Admin</button>
            </div>
        </div>

        <div id="printArea" class="bg-gray-800 p-6 rounded-2xl border border-gray-700 hidden text-black">
            <h2 class="text-lg font-semibold mb-4 text-white">Label Resi Siap Cetak</h2>
            <div class="bg-white p-6 rounded-xl max-w-md mx-auto text-center shadow-lg">
                <h3 class="font-bold text-xl text-blue-900">PARAMBOS LOGISTICS</h3>
                <p class="text-xs text-gray-500 mb-2">Ekspedisi & Logistik Terpercaya</p>
                <hr class="my-2 border-gray-300">
                <svg id="barcode" class="mx-auto"></svg>
                <p class="text-xs font-mono font-bold mt-1" id="lblDoNumber"></p>
                <div class="text-left text-sm mt-4 space-y-1">
                    <p><strong>Pelanggan:</strong> <span id="lblCustomer"></span></p>
                    <p><strong>Tujuan:</strong> <span id="lblDestination"></span></p>
                    <p><strong>Status:</strong> <span id="lblStatus"></span></p>
                </div>
            </div>
            <div class="text-center mt-4">
                <button onclick="window.print()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-xl font-semibold">🖨️ Cetak Resi / PDF</button>
            </div>
        </div>
    </div>

    <script>
        const PASS_ADMIN = "parambos123"; // Kata sandi masuk panel admin

        function checkAdminPassword() {
            const inputPass = document.getElementById('adminPassInput').value;
            if (inputPass === PASS_ADMIN) {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        function saveDO() {
            const doNum = document.getElementById('doNumber').value;
            const customer = document.getElementById('customerName').value;
            const dest = document.getElementById('destination').value;
            const status = document.getElementById('statusSelect').value;

            if(!doNum || !customer || !dest) {
                alert('Silakan isi Nomor DO, Nama Pelanggan, dan Tujuan!');
                return;
            }

            document.getElementById('lblDoNumber').innerText = doNum;
            document.getElementById('lblCustomer').innerText = customer;
            document.getElementById('lblDestination').innerText = dest;
            document.getElementById('lblStatus').innerText = status;

            JsBarcode("#barcode", doNum, {
                format: "CODE128",
                lineColor: "#000",
                width: 2,
                height: 50,
                displayValue: false
            });

            document.getElementById('printArea').classList.remove('hidden');
        }

        function sendWA(target) {
            const doNum = document.getElementById('doNumber').value;
            const customer = document.getElementById('customerName').value;
            const dest = document.getElementById('destination').value;
            const status = document.getElementById('statusSelect').value;
            const log = document.getElementById('latestLog').value;

            let targetNum = "";
            let message = "";

            if (target === 'customer') {
                targetNum = document.getElementById('waNumber').value;
                if(!doNum || !targetNum) {
                    alert('Masukkan Nomor DO dan No. WA Pelanggan!');
                    return;
                }
                message = `Halo Kak *${customer}*,\n\nBerikut update pengiriman barang untuk Nomor DO: *${doNum}*\n📍 *Tujuan:* ${dest}\n📦 *Status:* ${status}\n📝 *Posisi Terkini:* ${log}\n\nLacak status pengiriman Anda kapan saja di:\nhttps://parambos-raya.vercel.app\n\nTerima kasih,\n*PARAMBOS LOGISTICS*`;
            } else {
                targetNum = document.getElementById('adminWaNumber').value;
                if(!doNum || !targetNum) {
                    alert('Masukkan Nomor DO dan No. WA Admin Operasional!');
                    return;
                }
                message = `[ARSIP OPERASIONAL ADMIN]\n\nUpdate Resi/DO: *${doNum}*\nPengirim/Penerima: ${customer}\nTujuan: ${dest}\nStatus: ${status}\nCatatan: ${log}\n\nStatus telah berhasil diperbarui di sistem.`;
            }

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${targetNum}?text=${encodedMessage}`, '_blank');
        }
    </script>
</body>
</html>
